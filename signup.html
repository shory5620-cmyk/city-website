<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-box">
  <h2>Signup</h2>

  <input id="email" type="email" placeholder="Enter Email">
  <button onclick="sendOTP()">Send OTP</button>

  <input id="otp" type="text" placeholder="Enter OTP">

  <input id="password" type="password" placeholder="Password">
  <input id="confirmPassword" type="password" placeholder="Confirm Password">

  <button onclick="signup()">Signup</button>

  <p id="msg"></p>

  <p>Already have account? <a href="auth.html">Login</a></p>
</div>

<script>
async function sendOTP() {
  const email = document.getElementById("email").value;
  const msg = document.getElementById("msg");

  if (!email) {
    msg.innerText = "Enter email";
    return;
  }

  await fetch("http://localhost:3000/send-otp", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email })
  });

  msg.style.color = "green";
  msg.innerText = "OTP sent to your email";
}

async function signup() {
  const email = document.getElementById("email").value;
  const otp = document.getElementById("otp").value;
  const pass = document.getElementById("password").value;
  const confirm = document.getElementById("confirmPassword").value;
  const msg = document.getElementById("msg");

  if (pass !== confirm) {
    msg.style.color = "red";
    msg.innerText = "Password not match";
    return;
  }

  const res = await fetch("http://localhost:3000/verify-otp", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, otp })
  });

  const data = await res.json();

  if (data.success) {
    localStorage.setItem("userEmail", email);
    localStorage.setItem("userPass", pass);
    msg.style.color = "green";
    msg.innerText = "Signup successful";
    setTimeout(() => {
      window.location.href = "auth.html";
    }, 1000);
  } else {
    msg.style.color = "red";
    msg.innerText = "OTP wrong";
  }
}
</script>

</body>
</html>
